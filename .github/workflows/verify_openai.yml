name: Verify OpenAI Secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install OpenAI SDK
        run: python -m pip install "openai>=1.0.0"

      - name: Make minimal model request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          python -c 'import os; from openai import OpenAI;
          assert os.environ.get("OPENAI_API_KEY"), "OPENAI_API_KEY is missing";
          response = OpenAI().responses.create(model="gpt-5.6-luna", input="Reply with exactly OK.", max_output_tokens=8);
          assert response.output_text.strip(), "Model returned no text";
          print("OpenAI secret and gpt-5.6-luna request verified successfully.")'
