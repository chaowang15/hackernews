name: HN Top Stories (Incremental)

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "Edition to publish"
        required: true
        default: "full"
        type: choice
        options:
          - morning
          - full
  schedule:
    # 8am and 6pm America/Los_Angeles. GitHub cron is UTC without DST, so each slot has a PDT and a
    # PST trigger; the "Decide edition" step skips the one that is early or already published.
    # Minute 5 avoids the top-of-hour queue, where scheduled runs are often delayed for hours.
    - cron: "5 15 * * *"  # 08:05 PDT / 07:05 PST
    - cron: "5 16 * * *"  # 09:05 PDT / 08:05 PST
    - cron: "5 1 * * *"   # 18:05 PDT / 17:05 PST
    - cron: "5 2 * * *"   # 19:05 PDT / 18:05 PST
    # Backups: GitHub sometimes drops scheduled runs. The gate step skips a slot that is already published.
    - cron: "35 17 * * *" # 10:35 PDT / 09:35 PST
    - cron: "35 3 * * *"  # 20:35 PDT / 19:35 PST


permissions:
  contents: write

concurrency:
  group: hn-top-stories
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decide edition
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT_EDITION: ${{ inputs.edition }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import glob, json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/Los_Angeles"))
          if os.environ["EVENT"] == "workflow_dispatch":
              edition = os.environ["INPUT_EDITION"]
          elif 8 <= now.hour < 18:
              edition = "morning"
          elif now.hour >= 18:
              edition = "full"
          else:
              edition = ""  # before 8am: the early trigger of the DST pair (or a run delayed past midnight)
          done = set()  # slots already published today, judged by the run's local hour
          for f in glob.glob(now.strftime("hackernews/%Y/%m/%d/top_stories_*.json")):
              meta = json.load(open(f)).get("meta", {})
              hour = int((meta.get("run_time_local") or "0:").split(":")[0] or 0)
              if hour >= 18 and meta.get("edition") == "full":
                  done.add("full")
              elif hour >= 8:
                  done.add("morning")
          if os.environ["EVENT"] != "workflow_dispatch" and edition in done | ({"morning"} if "full" in done else set()):
              edition = ""  # this slot is already published today
          print(f"edition={edition}")
          print(f"[plan] {now:%Y-%m-%d %H:%M %Z} published={sorted(done)} -> {edition or 'skip'}", file=__import__('sys').stderr)
          PY

      - name: Run scraper (top stories, incremental)
        if: steps.plan.outputs.edition != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EDITION: ${{ steps.plan.outputs.edition }}
        run: |
          echo "Publishing edition: $EDITION"
          python news_scraper/main.py top "$EDITION"

      - name: Pipeline summary
        run: |
          echo "## 📊 Pipeline Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Mode | Daily Top Stories |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Time (UTC) | $(date -u '+%Y-%m-%d %H:%M:%S') |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Latest outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          find hackernews -type f \( -name "top_stories_*.md" -o -name "top_stories_*.json" \) | sort | tail -n 10 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/scrape_run_log.md ]; then
            echo "### Scrape Run Log (today)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 5 logs/scrape_run_log.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f logs/openai_token_usage_log.md ]; then
            echo "### Token Usage (latest batch)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 10 logs/openai_token_usage_log.md >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          
      - name: Commit & push
        run: |
          set -euxo pipefail
          git config user.name "hn-news-bot"
          git config user.email "hn-news-bot@users.noreply.github.com"

          git add -A
          echo "Git status:"
          git status --porcelain
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update HN Top Stories (incremental)"

          # Pull --rebase AFTER commit so there are no unstaged changes
          git pull --rebase origin main || true

          git push

